openapi: 3.0.3

info:
  title: Library App API
  description: Simple API to manage libraries, books, authors, genres, book copies, arrivals, sales, stock movements, and customers.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local server

tags:
  - name: Health
    description: Check the API
  - name: Library
    description: Manage libraries
  - name: Book
    description: Manage books
  - name: Author
    description: Manage authors
  - name: Genre
    description: Manage genres
  - name: BookCopy
    description: Manage book copies and stock
  - name: Arrival
    description: Manage arrivals
  - name: Customer
    description: Manage customers
  - name: Sale
    description: Manage sales
  - name: StockMovement
    description: Read stock movements

paths:

  /ping:
    get:
      tags: [Health]
      summary: Check if the server is running
      responses:
        '200':
          description: Server is running
          content:
            text/plain:
              schema:
                type: string
                example: pong

  /health/email:
    get:
      tags: [Health]
      summary: Test email sending
      parameters:
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: email
            example: user@example.com
      responses:
        '200':
          description: Email was sent
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '500':
          $ref: '#/components/responses/InternalError'

  /libraries:
    post:
      tags: [Library]
      summary: Create a library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLibraryRequest'
      responses:
        '201':
          description: Library created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Library]
      summary: List all libraries
      responses:
        '200':
          description: List of libraries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /libraries/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      tags: [Library]
      summary: Get a library by id
      responses:
        '200':
          description: Library found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Library]
      summary: Update a library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLibraryRequest'
      responses:
        '200':
          description: Library updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Library]
      summary: Delete a library
      responses:
        '204':
          description: Library deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /authors:
    post:
      tags: [Author]
      summary: Create an author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthorRequest'
      responses:
        '201':
          description: Author created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Author]
      summary: List all authors
      responses:
        '200':
          description: List of authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /authors/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      tags: [Author]
      summary: Get an author by id
      responses:
        '200':
          description: Author found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Author]
      summary: Update an author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAuthorRequest'
      responses:
        '200':
          description: Author updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Author]
      summary: Delete an author
      responses:
        '204':
          description: Author deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /genres:
    post:
      tags: [Genre]
      summary: Create a genre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenreRequest'
      responses:
        '201':
          description: Genre created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Genre]
      summary: List all genres
      responses:
        '200':
          description: List of genres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenreResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /genres/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      tags: [Genre]
      summary: Get a genre by id
      responses:
        '200':
          description: Genre found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Genre]
      summary: Update a genre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGenreRequest'
      responses:
        '200':
          description: Genre updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Genre]
      summary: Delete a genre
      responses:
        '204':
          description: Genre deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /genres/{genreId}/revenue:
    parameters:
      - name: genreId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Genre]
      summary: Get revenue for a genre
      description: Calculate revenue from sold books that contain the selected genre.
      responses:
        '200':
          description: Genre revenue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreRevenueResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /books:
    post:
      tags: [Book]
      summary: Create a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Book]
      summary: List all books
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /books/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      tags: [Book]
      summary: Get a book by id
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Book]
      summary: Update a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
      responses:
        '200':
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Book]
      summary: Delete a book
      responses:
        '204':
          description: Book deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /books/{id}/authors:
    parameters:
      - $ref: '#/components/parameters/Id'

    put:
      tags: [Book]
      summary: Set authors of a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignAuthorsRequest'
      responses:
        '200':
          description: Authors set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /books/{id}/genres:
    parameters:
      - $ref: '#/components/parameters/Id'

    put:
      tags: [Book]
      summary: Set genres of a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignGenresRequest'
      responses:
        '200':
          description: Genres set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /books/{bookId}/stock:
    parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Book]
      summary: Get total stock of a book
      responses:
        '200':
          description: Total stock of the book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookTotalStockResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /book-copies:
    post:
      tags: [BookCopy]
      summary: Create a book copy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookCopyRequest'
      responses:
        '201':
          description: Book copy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [BookCopy]
      summary: List book copies
      parameters:
        - name: bookId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: libraryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BookCopyStatus'
      responses:
        '200':
          description: List of book copies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookCopyResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /book-copies/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      tags: [BookCopy]
      summary: Get a book copy by id
      responses:
        '200':
          description: Book copy found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopyResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [BookCopy]
      summary: Update a book copy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookCopyRequest'
      responses:
        '200':
          description: Book copy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [BookCopy]
      summary: Delete a book copy
      responses:
        '204':
          description: Book copy deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /book-copies/{bookCopyId}/stock:
    parameters:
      - name: bookCopyId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [BookCopy]
      summary: Get current stock of a book copy
      responses:
        '200':
          description: Current stock of the book copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookStockResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /book-copies/low-stock:
    get:
      tags: [BookCopy]
      summary: Get book copies with low stock
      parameters:
        - name: threshold
          in: query
          required: false
          schema:
            type: integer
            default: 3
            example: 5
      responses:
        '200':
          description: List of book copies with low stock
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LowStockResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /arrivals:
    post:
      tags: [Arrival]
      summary: Create an arrival
      description: This adds stock automatically and creates a stock movement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArrivalRequest'
      responses:
        '201':
          description: Arrival created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrivalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Arrival]
      summary: List arrivals
      parameters:
        - name: bookCopyId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of arrivals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArrivalResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /arrivals/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      tags: [Arrival]
      summary: Get an arrival by id
      responses:
        '200':
          description: Arrival found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrivalResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Arrival]
      summary: Update an arrival
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArrivalRequest'
      responses:
        '200':
          description: Arrival updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrivalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Arrival]
      summary: Delete an arrival
      responses:
        '204':
          description: Arrival deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /customers:
    post:
      tags: [Customer]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Customer]
      summary: List all customers
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /customers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      tags: [Customer]
      summary: Get a customer by id
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Customer]
      summary: Update a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Customer]
      summary: Delete a customer
      responses:
        '204':
          description: Customer deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sales:
    post:
      tags: [Sale]
      summary: Create a sale
      description: This removes stock automatically and creates stock movements.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleRequest'
      responses:
        '201':
          description: Sale created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Sale]
      summary: List sales
      parameters:
        - name: customerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: libraryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaleResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /sales/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      tags: [Sale]
      summary: Get a sale by id
      responses:
        '200':
          description: Sale found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Sale]
      summary: Update a sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSaleRequest'
      responses:
        '200':
          description: Sale updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Sale]
      summary: Delete a sale
      responses:
        '204':
          description: Sale deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /stock-movements:
    get:
      tags: [StockMovement]
      summary: List stock movements
      parameters:
        - name: bookCopyId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: movementType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MovementType'
        - name: reason
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MovementReason'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of stock movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockMovementResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /stock-movements/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      tags: [StockMovement]
      summary: Get a stock movement by id
      responses:
        '200':
          description: Stock movement found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [StockMovement]
      summary: Updating a stock movement is not allowed
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags: [StockMovement]
      summary: Deleting a stock movement is not allowed
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'

components:

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExceptionBody'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExceptionBody'

    Forbidden:
      description: Action not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExceptionBody'

