components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExceptionBody'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExceptionBody'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExceptionBody'
    Forbidden:
      description: Action not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExceptionBody'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExceptionBody'

  schemas:
    ExceptionBody:
      type: object
      properties:
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: Resource not found
        path:
          type: string
          example: /libraries/00000000-0000-0000-0000-000000000000
        timestamp:
          type: string
          format: date-time

    BookCopyFormat:
      type: string
      enum:
        - POCKET
        - LARGE_FORMAT
        - ILLUSTRATED
        - COLLECTOR
        - DIGITAL
        - PHYSICAL

    BookCopyStatus:
      type: string
      enum:
        - AVAILABLE
        - UNAVAILABLE
        - BORROWED
        - RESERVED
        - DAMAGED
        - LOST
        - RESOLVED

    MovementType:
      type: string
      enum:
        - IN
        - OUT

    MovementReason:
      type: string
      enum:
        - ARRIVAL
        - SALE
        - RETURN
        - DAMAGED
        - LOST

    Sexe:
      type: string
      enum:
        - M
        - F

    LibraryRequest:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Central Library
        address:
          type: string
          example: Analakely, Antananarivo
        phone:
          type: string
          example: "0341234567"

    LibraryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        phone:
          type: string

    AuthorCreateRequest:
      type: object
      required:
        - firstName
        - lastName
        - sexe
      properties:
        firstName:
          type: string
          example: Robert
        lastName:
          type: string
          example: Martin
        sexe:
          $ref: '#/components/schemas/Sexe'

    AuthorUpdateRequest:
      type: object
      required:
        - firstName
        - lastName
      properties:
        firstName:
          type: string
          example: Robert C.
        lastName:
          type: string
          example: Martin

    AuthorResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        sexe:
          $ref: '#/components/schemas/Sexe'

    GenreCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Fantasy

    GenreUpdateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Science Fiction

    GenreResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    GenreRevenueResponse:
      type: object
      properties:
        genreId:
          type: string
          format: uuid
        name:
          type: string
          example: Computer Science
        revenue:
          type: number
          format: decimal
          example: 515000

    BookRequest:
      type: object
      required:
        - title
        - price
        - libraryId
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Clean Code
        isbn:
          type: string
          example: "9780132350884"
        publicationYear:
          type: integer
          example: 2008
        price:
          type: number
          format: decimal
          example: 45000
        libraryId:
          type: string
          format: uuid

    BookResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        isbn:
          type: string
        publicationYear:
          type: integer
        price:
          type: number
          format: decimal
        libraryId:
          type: string
          format: uuid

    BookTotalStockResponse:
      type: object
      properties:
        bookId:
          type: string
          format: uuid
        bookTitle:
          type: string
        totalStock:
          type: integer
          example: 42

    CreateBookCopyRequest:
      type: object
      required:
        - bookId
        - libraryId
        - format
        - isbn
        - sellingPrice
        - status
      properties:
        bookId:
          type: string
          format: uuid
        libraryId:
          type: string
          format: uuid
        format:
          $ref: '#/components/schemas/BookCopyFormat'
        isbn:
          type: string
          minLength: 13
          maxLength: 13
          example: "9780132350885"
        sellingPrice:
          type: number
          format: decimal
          example: 50000
        status:
          $ref: '#/components/schemas/BookCopyStatus'

    UpdateBookCopyRequest:
      type: object
      required:
        - format
        - sellingPrice
        - status
      properties:
        format:
          $ref: '#/components/schemas/BookCopyFormat'
        sellingPrice:
          type: number
          format: decimal
          example: 55000
        status:
          $ref: '#/components/schemas/BookCopyStatus'

    BookCopyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        bookTitle:
          type: string
        libraryId:
          type: string
          format: uuid
        libraryName:
          type: string
        format:
          $ref: '#/components/schemas/BookCopyFormat'
        isbn:
          type: string
        sellingPrice:
          type: number
          format: decimal
        status:
          $ref: '#/components/schemas/BookCopyStatus'

    BookStockResponse:
      type: object
      properties:
        bookCopyId:
          type: string
          format: uuid
        bookTitle:
          type: string
          example: Clean Code
        bookCopyIsbn:
          type: string
          example: "9780132350885"
        totalIn:
          type: integer
          example: 80
        totalOut:
          type: integer
          example: 8
        currentStock:
          type: integer
          example: 72

    LowStockResponse:
      type: object
      properties:
        bookCopyId:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        bookTitle:
          type: string
        format:
          $ref: '#/components/schemas/BookCopyFormat'
        isbn:
          type: string
        currentStock:
          type: integer

    CreateArrivalRequest:
      type: object
      required:
        - bookCopyId
        - quantity
        - unitPrice
        - arrivalDate
      properties:
        bookCopyId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          example: 50
        unitPrice:
          type: number
          format: decimal
          exclusiveMinimum: true
          minimum: 0
          example: 40000
        arrivalDate:
          type: string
          format: date-time
          example: "2024-01-15T08:00:00Z"

    UpdateArrivalRequest:
      type: object
      required:
        - quantity
        - unitPrice
        - arrivalDate
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 30
        unitPrice:
          type: number
          format: decimal
          exclusiveMinimum: true
          minimum: 0
          example: 42000
        arrivalDate:
          type: string
          format: date-time
          example: "2024-02-01T09:00:00Z"

    ArrivalResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookCopyId:
          type: string
          format: uuid
        bookTitle:
          type: string
        bookCopyIsbn:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: decimal
        totalPrice:
          type: number
          format: decimal
        arrivalDate:
          type: string
          format: date-time

    CreateCustomerRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phone
      properties:
        firstName:
          type: string
          example: Rakoto
        lastName:
          type: string
          example: Andriantsoa
        email:
          type: string
          format: email
          example: rakoto@gmail.com
        phone:
          type: string
          example: "0341112233"

    UpdateCustomerRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phone
      properties:
        firstName:
          type: string
          example: Rakoto
        lastName:
          type: string
          example: Andriantsoa
        email:
          type: string
          format: email
          example: rakoto.updated@gmail.com
        phone:
          type: string
          example: "0341112233"

    CustomerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSaleItemRequest:
      type: object
      required:
        - bookCopyId
        - quantity
        - unitPrice
      properties:
        bookCopyId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          example: 3
        unitPrice:
          type: number
          format: decimal
          exclusiveMinimum: true
          minimum: 0
          example: 55000

    CreateSaleRequest:
      type: object
      required:
        - customerId
        - libraryId
        - saleDate
        - saleItems
      properties:
        customerId:
          type: string
          format: uuid
        libraryId:
          type: string
          format: uuid
        saleDate:
          type: string
          format: date-time
          example: "2024-03-01T10:00:00Z"
        saleItems:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateSaleItemRequest'

    UpdateSaleRequest:
      type: object
      required:
        - saleDate
        - saleItems
      properties:
        saleDate:
          type: string
          format: date-time
          example: "2024-03-01T10:00:00Z"
        saleItems:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateSaleItemRequest'

    SaleItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookCopyId:
          type: string
          format: uuid
        bookTitle:
          type: string
        bookCopyIsbn:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: decimal
        totalPrice:
          type: number
          format: decimal

    SaleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        customerFirstName:
          type: string
        customerLastName:
          type: string
        libraryId:
          type: string
          format: uuid
        libraryName:
          type: string
        saleDate:
          type: string
          format: date-time
        totalAmount:
          type: number
          format: decimal
        saleItems:
          type: array
          items:
            $ref: '#/components/schemas/SaleItemResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StockMovementResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        quantity:
          type: integer
        movementType:
          $ref: '#/components/schemas/MovementType'
        reason:
          $ref: '#/components/schemas/MovementReason'
        bookCopyId:
          type: string
          format: uuid
        bookTitle:
          type: string
        bookCopyIsbn:
          type: string
        arrivalId:
          type: string
          format: uuid
          nullable: true
        saleItemId:
          type: string
          format: uuid
          nullable: true
        movementDate:
          type: string
          format: date-time