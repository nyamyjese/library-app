openapi: 3.0.3
info:
  title: Library App API
  description: Simple API to manage libraries, books, book copies, arrivals, sales, stock, and customers.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local server

tags:
  - name: Library
    description: Manage libraries
  - name: Book
    description: Manage books
  - name: Author
    description: Manage authors
  - name: Genre
    description: Manage genres
  - name: BookCopy
    description: Manage book copies and stock
  - name: Arrival
    description: Manage arrivals
  - name: Customer
    description: Manage customers
  - name: Sale
    description: Manage sales
  - name: StockMovement
    description: Read stock movements
  - name: Health
    description: Check the API

paths:
  /ping:
    get:
      tags: [Health]
      summary: Check if the server is running
      responses:
        '200':
          description: Server is running
          content:
            text/plain:
              schema:
                type: string
                example: pong

  /health/email:
    get:
      tags: [Health]
      summary: Test email sending
      parameters:
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Email was sent
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '500':
          $ref: '#/components/responses/InternalError'

  /libraries:
    post:
      tags: [Library]
      summary: Create a library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryRequest'
      responses:
        '201':
          description: Library created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Library]
      summary: List all libraries
      responses:
        '200':
          description: List of libraries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /libraries/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Library]
      summary: Get a library by id
      responses:
        '200':
          description: Library found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Library]
      summary: Update a library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryRequest'
      responses:
        '200':
          description: Library updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Library]
      summary: Delete a library
      responses:
        '204':
          description: Library deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /libraries/search:
    get:
      tags: [Library]
      summary: Search libraries by name
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            example: Central Library
      responses:
        '200':
          description: Matching libraries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /authors:
    post:
      tags: [Author]
      summary: Create an author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorCreateRequest'
      responses:
        '201':
          description: Author created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Author]
      summary: List all authors
      responses:
        '200':
          description: List of authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /authors/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Author]
      summary: Get an author by id
      responses:
        '200':
          description: Author found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Author]
      summary: Update an author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorUpdateRequest'
      responses:
        '200':
          description: Author updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Author]
      summary: Delete an author
      responses:
        '204':
          description: Author deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /authors/search:
    get:
      tags: [Author]
      summary: Search authors by last name
      parameters:
        - name: lastName
          in: query
          required: true
          schema:
            type: string
            example: Martin
      responses:
        '200':
          description: Matching authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /authors/{authorId}/books/{bookId}:
    parameters:
      - name: authorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: bookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Author]
      summary: Add an author to a book
      responses:
        '204':
          description: Author added to book
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Author]
      summary: Remove an author from a book
      responses:
        '204':
          description: Author removed from book
        '500':
          $ref: '#/components/responses/InternalError'

  /authors/{authorId}/books:
    get:
      tags: [Author]
      summary: List book ids by author
      parameters:
        - name: authorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of book ids
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        '500':
          $ref: '#/components/responses/InternalError'

  /authors/books/{bookId}/authors:
    get:
      tags: [Author]
      summary: List authors of a book
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /genres:
    post:
      tags: [Genre]
      summary: Create a genre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenreCreateRequest'
      responses:
        '201':
          description: Genre created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Genre]
      summary: List or search genres
      parameters:
        - name: name
          in: query
          required: false
          description: Search genres by name
          schema:
            type: string
            example: Fantasy
      responses:
        '200':
          description: List of genres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenreResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /genres/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Genre]
      summary: Get a genre by id
      responses:
        '200':
          description: Genre found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Genre]
      summary: Update a genre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenreUpdateRequest'
      responses:
        '200':
          description: Genre updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Genre]
      summary: Delete a genre
      responses:
        '204':
          description: Genre deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /genres/{genreId}/revenue:
    parameters:
      - name: genreId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Genre]
      summary: Get revenue for a genre
      description: Calculate revenue from sold books that contain the selected genre.
      responses:
        '200':
          description: Genre revenue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreRevenueResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /genres/{genreId}/books/{bookId}:
    parameters:
      - name: genreId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: bookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Genre]
      summary: Add a genre to a book
      responses:
        '201':
          description: Genre added to book
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Genre]
      summary: Remove a genre from a book
      responses:
        '204':
          description: Genre removed from book
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /genres/books/{bookId}/genres:
    get:
      tags: [Genre]
      summary: List genres of a book
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of genres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenreResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /genres/{genreId}/books:
    get:
      tags: [Genre]
      summary: List book ids by genre
      parameters:
        - name: genreId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of book ids
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /books:
    post:
      tags: [Book]
      summary: Create a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Book]
      summary: List all books
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /books/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Book]
      summary: Get a book by id
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Book]
      summary: Update a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '200':
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Book]
      summary: Delete a book
      responses:
        '204':
          description: Book deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /books/search/title:
    get:
      tags: [Book]
      summary: Search books by title
      parameters:
        - name: title
          in: query
          required: true
          schema:
            type: string
            example: Clean Code
      responses:
        '200':
          description: Matching books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /books/search/isbn:
    get:
      tags: [Book]
      summary: Search a book by ISBN
      parameters:
        - name: isbn
          in: query
          required: true
          schema:
            type: string
            example: "9780132350884"
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /books/library/{libraryId}:
    get:
      tags: [Book]
      summary: List books by library
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /books/filter/year:
    get:
      tags: [Book]
      summary: Filter books by publication year
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            example: 2008
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /books/sort/title:
    get:
      tags: [Book]
      summary: List books sorted by title
      responses:
        '200':
          description: Books sorted by title
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /books/sort/price:
    get:
      tags: [Book]
      summary: List books sorted by price
      responses:
        '200':
          description: Books sorted by price
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /books/{bookId}/stock:
    get:
      tags: [Book]
      summary: Get total stock of a book
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Total stock of the book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookTotalStockResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /book-copies:
    post:
      tags: [BookCopy]
      summary: Create a book copy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookCopyRequest'
      responses:
        '201':
          description: Book copy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [BookCopy]
      summary: List book copies
      parameters:
        - name: bookId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: libraryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BookCopyStatus'
      responses:
        '200':
          description: List of book copies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookCopyResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /book-copies/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [BookCopy]
      summary: Get a book copy by id
      responses:
        '200':
          description: Book copy found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopyResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [BookCopy]
      summary: Update a book copy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookCopyRequest'
      responses:
        '200':
          description: Book copy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [BookCopy]
      summary: Delete a book copy
      responses:
        '204':
          description: Book copy deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /book-copies/{bookCopyId}/stock:
    parameters:
      - name: bookCopyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [BookCopy]
      summary: Get current stock of a book copy
      responses:
        '200':
          description: Current stock of the book copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookStockResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /book-copies/low-stock:
    get:
      tags: [BookCopy]
      summary: Get low stock book copies
      parameters:
        - name: threshold
          in: query
          required: false
          schema:
            type: integer
            default: 3
      responses:
        '200':
          description: List of low stock book copies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LowStockResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /book-copies/available:
    get:
      tags: [BookCopy]
      summary: List available book copies
      parameters:
        - name: bookId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Available book copies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookCopyResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /book-copies/count/available:
    get:
      tags: [BookCopy]
      summary: Count available book copies by book
      parameters:
        - name: bookId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Number of available copies
          content:
            application/json:
              schema:
                type: integer
                format: int64
                example: 4
        '500':
          $ref: '#/components/responses/InternalError'

  /book-copies/{id}/status:
    patch:
      tags: [BookCopy]
      summary: Update a book copy status
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/BookCopyStatus'
      responses:
        '200':
          description: Book copy status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopyResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /arrivals:
    post:
      tags: [Arrival]
      summary: Create an arrival
      description: This adds stock automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArrivalRequest'
      responses:
        '201':
          description: Arrival created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrivalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Arrival]
      summary: List arrivals
      parameters:
        - name: bookCopyId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: bookId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of arrivals
          content:
            application/json:
