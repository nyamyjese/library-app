openapi: 3.0.3
info:
  title: Library App API
  version: 1.0.0
  description: |
    REST API for managing a library business: books, libraries, book copies,
    stock arrivals, customers and sales.
servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
    description: Health check endpoints.
  - name: Books
    description: Operations for managing books.
  - name: Libraries
    description: Operations for managing libraries.
  - name: Book copies
    description: Operations for managing physical or digital copies of books.
  - name: Arrivals
    description: Operations for managing stock arrivals.
  - name: Customers
    description: Operations for managing customers.
  - name: Sales
    description: Operations for managing sales and sale items.

paths:
  /ping:
    get:
      tags: [Health]
      summary: Check API availability
      description: Returns a simple response to confirm that the API is running.
      operationId: ping
      responses:
        '200':
          description: API is running.
          content:
            text/plain:
              schema:
                type: string
                example: pong

  /health/email:
    get:
      tags: [Health]
      summary: Send health check emails
      description: Sends a set of health check emails to verify the email delivery configuration.
      operationId: sendHealthEmails
      parameters:
        - name: to
          in: query
          required: true
          description: Recipient email address used for the health check.
          schema:
            type: string
            format: email
            example: user@example.com
      responses:
        '200':
          description: Health emails were requested successfully.
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/books:
    get:
      tags: [Books]
      summary: List books
      description: Returns all books registered in the system.
      operationId: getBooks
      responses:
        '200':
          description: List of books.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
    post:
      tags: [Books]
      summary: Create a book
      description: Creates a new book and attaches it to a library.
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '201':
          description: Book created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/books/{id}:
    get:
      tags: [Books]
      summary: Get a book by id
      description: Returns a single book by its unique identifier.
      operationId: getBookById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Book found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Books]
      summary: Update a book
      description: Updates an existing book.
      operationId: updateBook
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '200':
          description: Book updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Books]
      summary: Delete a book
      description: Deletes a book by id.
      operationId: deleteBook
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '204':
          description: Book deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/books/search/title:
    get:
      tags: [Books]
      summary: Search books by title
      description: Returns books whose title matches the provided search text.
      operationId: searchBooksByTitle
      parameters:
        - name: title
          in: query
          required: true
          description: Title text to search for.
          schema:
            type: string
            example: Clean Code
      responses:
        '200':
          description: Matching books.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /api/books/search/isbn:
    get:
      tags: [Books]
      summary: Search a book by ISBN
      description: Returns a book matching the provided ISBN.
      operationId: searchBookByIsbn
      parameters:
        - name: isbn
          in: query
          required: true
          description: Book ISBN.
          schema:
            type: string
            example: '9780132350884'
      responses:
        '200':
          description: Matching book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/books/library/{libraryId}:
    get:
      tags: [Books]
      summary: List books by library
      description: Returns all books attached to a specific library.
      operationId: getBooksByLibrary
      parameters:
        - name: libraryId
          in: path
          required: true
          description: Library unique identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Books attached to the library.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /api/books/filter/year:
    get:
      tags: [Books]
      summary: Filter books by publication year
      description: Returns books published in the specified year.
      operationId: getBooksByYear
      parameters:
        - name: year
          in: query
          required: true
          description: Publication year.
          schema:
            type: integer
            example: 2024
      responses:
        '200':
          description: Books published in the specified year.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /api/books/sort/title:
    get:
      tags: [Books]
      summary: List books sorted by title
      description: Returns all books sorted alphabetically by title.
      operationId: getBooksSortedByTitle
      responses:
        '200':
          description: Books sorted by title.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /api/books/sort/price:
    get:
      tags: [Books]
      summary: List books sorted by price
      description: Returns all books sorted by price.
      operationId: getBooksSortedByPrice
      responses:
        '200':
          description: Books sorted by price.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /libraries:
    get:
      tags: [Libraries]
      summary: List libraries
      description: Returns all libraries.
      operationId: getLibraries
      responses:
        '200':
          description: List of libraries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Library'
    post:
      tags: [Libraries]
      summary: Create a library
      description: Creates a new library.
      operationId: createLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryInput'
      responses:
        '200':
          description: Library created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '400':
          $ref: '#/components/responses/BadRequest'

  /libraries/{id}:
    get:
      tags: [Libraries]
      summary: Get a library by id
      description: Returns a single library by its unique identifier.
      operationId: getLibraryById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Library found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Libraries]
      summary: Update a library
      description: Updates an existing library.
      operationId: updateLibrary
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryInput'
      responses:
        '200':
          description: Library updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Libraries]
      summary: Delete a library
      description: Deletes a library by id.
      operationId: deleteLibrary
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Library deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'

  /libraries/search:
    get:
      tags: [Libraries]
      summary: Search libraries by name
      description: Returns libraries matching the provided name.
      operationId: searchLibraries
      parameters:
        - name: name
          in: query
          required: true
          description: Library name to search for.
          schema:
            type: string
            example: Central Library
      responses:
        '200':
          description: Matching libraries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Library'

  /book-copies:
    get:
      tags: [Book copies]
      summary: List book copies
      description: |
        Returns book copies. Optional filters can be applied by book id or library id.
        Use only one filter at a time.
      operationId: getBookCopies
      parameters:
        - name: bookId
          in: query
          required: false
          description: Filter copies by book id.
          schema:
            type: string
            format: uuid
        - name: libraryId
          in: query
          required: false
          description: Filter copies by library id.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of book copies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookCopy'

  /book-copies/{id}:
    get:
      tags: [Book copies]
      summary: Get a book copy by id
      description: Returns a single book copy by its unique identifier.
      operationId: getBookCopyById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Book copy found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopy'
        '404':
          $ref: '#/components/responses/NotFound'

  /book-copies/available:
    get:
      tags: [Book copies]
      summary: List available book copies
      description: Returns all available book copies, optionally filtered by book id.
      operationId: getAvailableBookCopies
      parameters:
        - name: bookId
          in: query
          required: false
          description: Filter available copies by book id.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Available book copies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookCopy'

  /book-copies/count/available:
    get:
      tags: [Book copies]
      summary: Count available copies by book
      description: Returns the number of available copies for a book.
      operationId: countAvailableBookCopiesByBook
      parameters:
        - name: bookId
          in: query
          required: true
          description: Book unique identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Number of available copies.
          content:
            application/json:
              schema:
                type: integer
                format: int64
                example: 4

  /book-copies/{id}/status:
    patch:
      tags: [Book copies]
      summary: Update a book copy status
      description: Updates the status of a book copy.
      operationId: updateBookCopyStatus
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - name: status
          in: query
          required: true
          description: New status of the book copy.
          schema:
            $ref: '#/components/schemas/BookCopyStatus'
      responses:
        '200':
          description: Book copy status updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /arrivals:
    get:
      tags: [Arrivals]
      summary: List arrivals
      description: |
        Returns stock arrivals. Optional filters can be applied by book copy id or book id.
        Use only one filter at a time.
      operationId: getArrivals
      parameters:
        - name: bookCopyId
          in: query
          required: false
          description: Filter arrivals by book copy id.
          schema:
            type: string
            format: uuid
        - name: bookId
          in: query
          required: false
          description: Filter arrivals by book id.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of arrivals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Arrival'
    post:
      tags: [Arrivals]
      summary: Create an arrival
      description: Creates a stock arrival for a book copy.
      operationId: createArrival
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArrivalRequest'
      responses:
        '201':
          description: Arrival created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arrival'
        '400':
          $ref: '#/components/responses/BadRequest'

  /arrivals/{id}:
    get:
      tags: [Arrivals]
      summary: Get an arrival by id
      description: Returns a single arrival by its unique identifier.
      operationId: getArrivalById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Arrival found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arrival'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Arrivals]
      summary: Update an arrival
      description: Updates an existing arrival.
      operationId: updateArrival
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArrivalRequest'
      responses:
        '200':
          description: Arrival updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arrival'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers:
    get:
      tags: [Customers]
      summary: List customers
      description: Returns all customers.
      operationId: getCustomers
      responses:
        '200':
          description: List of customers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      tags: [Customers]
      summary: Create a customer
      description: Creates a new customer.
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'

  /customers/{id}:
    get:
      tags: [Customers]
      summary: Get a customer by id
      description: Returns a single customer by its unique identifier.
      operationId: getCustomerById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Customer found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Customers]
      summary: Update a customer
      description: Updates an existing customer.
      operationId: updateCustomer
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Customer updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Customers]
      summary: Delete a customer
      description: Deletes a customer by id.
      operationId: deleteCustomer
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '204':
          description: Customer deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'

  /sales:
    get:
      tags: [Sales]
      summary: List sales
      description: Returns sales, optionally filtered by customer, library and date range.
      operationId: getSales
      parameters:
        - name: customerId
          in: query
          required: false
          description: Filter sales by customer id.
          schema:
            type: string
            format: uuid
        - name: libraryId
          in: query
          required: false
          description: Filter sales by library id.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: Start date-time of the sale date range.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: End date-time of the sale date range.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of sales.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sale'
    post:
      tags: [Sales]
      summary: Create a sale
      description: Creates a sale with one or more sale items.
      operationId: createSale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleRequest'
      responses:
        '201':
          description: Sale created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/BadRequest'

  /sales/{id}:
    get:
      tags: [Sales]
      summary: Get a sale by id
      description: Returns a single sale by its unique identifier.
      operationId: getSaleById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Sale found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Sales]
      summary: Update a sale
      description: Updates an existing sale and its sale items.
      operationId: updateSale
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSaleRequest'
      responses:
        '200':
          description: Sale updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Sales]
      summary: Delete a sale
      description: Deletes a sale by id.
      operationId: deleteSale
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '204':
          description: Sale deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      description: Resource unique identifier.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - $ref: '#/components/schemas/ValidationErrorResponse'
    Forbidden:
      description: Operation is forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      description: Standard error response.
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: Resource not found

    ValidationErrorResponse:
      type: object
      description: Validation error response keyed by field name.
      properties:
        status:
          type: integer
          example: 400
        errors:
          type: object
          additionalProperties:
            type: string
          example:
            email: The email is invalid
            firstName: The first name is mandatory

    Book:
      type: object
      description: Book resource.
      properties:
        id:
          type: string
          format: uuid
          description: Book unique identifier.
        title:
          type: string
          description: Book title.
          example: Clean Code
        isbn:
          type: string
          description: Book ISBN.
          example: '9780132350884'
        publicationYear:
          type: integer
          description: Year when the book was published.
          example: 2008
        price:
          type: number
          format: double
          description: Book base price.
          example: 45000
        libraryId:
          type: string
          format: uuid
          description: Identifier of the library that owns the book.
      required:
        - id
        - title
        - price
        - libraryId

    BookInput:
      type: object
      description: Payload used to create or update a book.
      properties:
        title:
          type: string
          description: Book title.
          example: Clean Code
        isbn:
          type: string
          description: Book ISBN.
          example: '9780132350884'
        publicationYear:
          type: integer
          description: Year when the book was published.
          example: 2008
        price:
          type: number
          format: double
          description: Book base price.
          example: 45000
        libraryId:
          type: string
          format: uuid
          description: Identifier of the library that owns the book.
      required:
        - title
        - price
        - libraryId

    Library:
      type: object
      description: Library resource.
      properties:
        id:
          type: string
          format: uuid
          description: Library unique identifier.
        name:
          type: string
          description: Library name.
          example: Central Library
        address:
          type: string
          description: Library address.
          example: 12 Main Street
        phone:
          type: string
          description: Library phone number.
          example: '+261341234567'
      required:
        - id
        - name

    LibraryInput:
      type: object
      description: Payload used to create or update a library.
      properties:
        name:
          type: string
          description: Library name.
          example: Central Library
        address:
          type: string
          description: Library address.
          example: 12 Main Street
        phone:
          type: string
          description: Library phone number.
          example: '+261341234567'
      required:
        - name

    BookCopy:
      type: object
      description: Copy of a book available in a library.
      properties:
        id:
          type: string
          format: uuid
          description: Book copy unique identifier.
        bookId:
          type: string
          format: uuid
          description: Related book identifier.
        libraryId:
          type: string
          format: uuid
          description: Related library identifier.
        format:
          $ref: '#/components/schemas/BookCopyFormat'
        isbn:
          type: string
          description: ISBN of this copy.
          example: '9780132350884'
        sellingPrice:
          type: number
          format: double
          description: Selling price of this copy.
          example: 50000
        status:
          $ref: '#/components/schemas/BookCopyStatus'
      required:
        - id
        - bookId
        - libraryId
        - format
        - sellingPrice
        - status

    BookCopyFormat:
      type: string
      description: Format of a book copy.
      enum:
        - PHYSICAL
        - DIGITAL
        - POCKET
        - LARGE_FORMAT
      example: PHYSICAL

    BookCopyStatus:
      type: string
      description: Status of a book copy.
      enum:
        - AVAILABLE
        - DAMAGED
        - LOST
        - RESOLVED
      example: AVAILABLE

    CreateArrivalRequest:
      type: object
      description: Payload used to create a stock arrival.
      properties:
        bookCopyId:
          type: string
          format: uuid
          description: Related book copy identifier.
        quantity:
          type: integer
          minimum: 1
          description: Quantity received.
